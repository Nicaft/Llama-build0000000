name: Build llama.cpp Android OpenCL

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install ninja
        run: sudo apt-get install -y ninja-build

      - name: Get OpenCL Headers and ICD Loader
        run: |
          git clone https://github.com/KhronosGroup/OpenCL-Headers
          cp -r OpenCL-Headers/CL $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
          git clone https://github.com/KhronosGroup/OpenCL-ICD-Loader
          cd OpenCL-ICD-Loader && mkdir build_ndk && cd build_ndk
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DOPENCL_ICD_LOADER_HEADERS_DIR=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 -DANDROID_STL=c++_shared
          ninja
          cp libOpenCL.so $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android

      - name: Clone llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp
          cd llama.cpp && git checkout b5028

      - name: Build
        run: |
          cd llama.cpp && mkdir build-android && cd build-android
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DBUILD_SHARED_LIBS=OFF -DGGML_OPENCL=ON -DGGML_OPENMP=OFF
          ninja
          cd bin && zip -r llama-android-opencl.zip llama-server llama-cli

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          files: llama.cpp/build-android/bin/llama-android-opencl.zip
          token: ${{ secrets.GITHUB_TOKEN }}
