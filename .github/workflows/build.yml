name: Build llama.cpp Android OpenCL

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "ANDROID_NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Get OpenCL Headers
        run: |
          git clone https://github.com/KhronosGroup/OpenCL-Headers
          cp -r OpenCL-Headers/CL $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include

      - name: Clone llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp
          cd llama.cpp && git checkout b5028

      - name: Build
        run: |
          cd llama.cpp
          mkdir build-android && cd build-android
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DBUILD_SHARED_LIBS=OFF -DGGML_OPENCL=ON
          make -j4

      - name: Upload binaries
        uses: actions/upload-artifact@v3
        with:
          name: llama-android-opencl
          path: llama.cpp/build-android/bin/
